# nginx.conf — the container's reverse-proxy front door for the dsh web
# profile. Replaces the Debian default configuration entirely (the packaged
# sites-enabled/default and conf.d are intentionally not included).
#
# WHY the Host/Origin rewrite:
#   dsh's /api browser-trust fence
#   (packages/client/connection/src/api-request-trust.ts) refuses any request
#   whose `Host` is neither a loopback authority nor a declared trustedHost,
#   and the privileged configuration-plane methods are pinned to loopback with
#   an empty trust list. The fence reads only HTTP headers, never the socket
#   address, so this proxy — running inside the same container and reaching dsh
#   over 127.0.0.1 — forces a loopback `Host`/`Origin` on every request. The
#   net effect is the requested outcome: dsh always classifies proxied traffic
#   as a local 127.0.0.1 client, disabling the local-loop restrictions that
#   would otherwise 403 any non-loopback deployment (regular /api RPC, the
#   loopback-pinned privileged methods, and the /api WebSocket downlinks all
#   share the same fence).
#
# SECURITY TRADE-OFF (deliberate): this disables dsh's DNS-rebinding and
# cross-site defenses for anything that can reach port 3081. Keep the exported
# port on a trusted network. dsh itself stays bound to 127.0.0.1 inside the
# container and is never reachable directly.

# Debian's nginx package runs workers as www-data (no `nginx` system user exists).
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Log to stdout so `docker logs` (or `docker compose logs dsh`) sees proxy
    # traffic — the container's nginx otherwise writes to /var/log/nginx and is
    # invisible from the host.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stdout warn;

    # Keep the upgrade hop alive for /api/events.mux and /api/events.host
    # while letting ordinary requests close their connection normally.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # nginx's port inside the container; the compose mapping exports it.
        listen 3081;
        server_name _;

        # Match dsh's default 300 MiB per-request body bound (image attachments).
        client_max_body_size 300m;

        location / {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;

            # ── loopback impersonation: make the dsh fence trust us ─────────
            proxy_set_header Host 127.0.0.1:3080;
            proxy_set_header Origin http://127.0.0.1:3080;
            proxy_set_header Sec-Fetch-Site same-origin;

            # ── WebSocket upgrades + streaming ───────────────────────────────
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # ── informational passthrough ────────────────────────────────────
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
